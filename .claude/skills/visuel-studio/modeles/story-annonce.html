<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Story annonce — modèle Forlife</title>
<!--
  MODÈLE « story / statut WhatsApp / reel cover » 1080×1920.
  Rendu : node .claude/skills/visuel-studio/scripts/rendre.mjs story.html story.png --format story
  Zones de sécurité : rien d'important dans les 250 px du haut (nom du compte) ni les 340 px du bas
  (champ de réponse, boutons). Pour vérifier, ajouter la classe "repere" sur <body> : les zones apparaissent en rouge.
-->
<style>
  :root { --accent: #EA7822; --or: #D9AC4E; --fond: #0D0D0D; --clair: #F9F6F2; }
  body { font-family: 'Poppins', sans-serif; background: var(--fond); color: var(--clair); }
  .page { position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: linear-gradient(170deg, #2D1C14 0%, #0D0D0D 60%); }
  .bande { position: absolute; left: -80px; width: 1240px; height: 170px; background: var(--accent); transform: rotate(-8deg); }
  .b1 { top: 330px; } .b2 { top: 1430px; opacity: .25; }
  .zone { position: absolute; left: 90px; right: 90px; top: 250px; bottom: 340px; display: flex; flex-direction: column; justify-content: center; }
  .date { font-weight: 800; font-size: 64px; color: #fff; letter-spacing: .04em; margin-bottom: 260px; position: relative; z-index: 1; }
  h1 { font-weight: 800; font-size: 120px; line-height: 1; margin: 0; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  p { font-size: 44px; line-height: 1.35; color: #e9e1d8; margin: 40px 0 0; }
  .cta { margin-top: 70px; align-self: flex-start; background: var(--clair); color: var(--fond); font-weight: 700; font-size: 44px;
         border-radius: 999px; padding: 26px 56px; }
  .signature { position: absolute; left: 90px; bottom: 380px; font-weight: 600; font-size: 34px; color: var(--or); }
  body.repere .page::before, body.repere .page::after { content: ''; position: absolute; left: 0; right: 0; background: rgba(255,0,0,.35); z-index: 9; }
  body.repere .page::before { top: 0; height: 250px; } body.repere .page::after { bottom: 0; height: 340px; }
</style>
</head>
<body>
<div class="page">
  <div class="bande b1"></div><div class="bande b2"></div>
  <div class="zone">
    <div class="date">SAMEDI 14 NOV.</div>
    <h1>Portes ouvertes <span>atelier</span></h1>
    <p>Venez voir l'impression DTF en direct et repartez avec votre tee-shirt personnalisé.</p>
    <div class="cta">Je réserve ma place →</div>
  </div>
  <div class="signature">Forlife Com' — Ensemble pour la vie !</div>
</div>
</body>
</html>
