<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Story annonce — modèle Forlife</title>
<!--
  MODÈLE « story / statut WhatsApp / couverture de reel » 1080×1920 : annonce d'événement.
  Rendu : node .claude/skills/visuel-studio/scripts/rendre.mjs story.html story.png --format story
  Une annonce d'événement dit toujours : QUOI, QUAND (jour, date, année, heure), OÙ, COMMENT réserver, QUI (logo).
  Zones de sécurité : rien d'important dans les 250 px du haut (nom du compte) ni les 340 px du bas
  (champ de réponse). Pour les voir : <body class="repere">.
  Sur Instagram, ajouter un sticker lien https://wa.me/2250585801856 au moment de publier.
-->
<style>
  :root { --accent: #EA7822; --fond: #0D0D0D; --clair: #F9F6F2; }
  body { font-family: 'Poppins', sans-serif; background: var(--fond); color: var(--clair); }
  .page { position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: linear-gradient(170deg, #2D1C14 0%, #0D0D0D 60%); }
  .bande { position: absolute; left: -80px; width: 1240px; height: 150px; background: var(--accent); transform: rotate(-6deg); }
  .b1 { top: 300px; } .b2 { top: 1470px; opacity: .22; }
  .zone { position: absolute; left: 90px; right: 90px; top: 250px; bottom: 340px; display: flex; flex-direction: column; }
  .date { position: relative; z-index: 1; margin-top: 78px; transform: rotate(-6deg); transform-origin: left;
          font-weight: 800; font-size: 54px; color: var(--fond); letter-spacing: .02em; }
  h1 { font-weight: 800; font-size: 116px; line-height: 1; margin: 230px 0 0; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .infos { margin-top: 48px; font-size: 40px; line-height: 1.45; color: #e9e1d8; }
  .infos strong { color: #fff; font-weight: 700; }
  .cta { margin-top: 56px; align-self: flex-start; background: var(--accent); color: var(--fond); font-weight: 700; font-size: 42px;
         border-radius: 999px; padding: 26px 50px; }
  .logo { margin-top: auto; height: 120px; align-self: flex-start; }
  body.repere .page::before, body.repere .page::after { content: ''; position: absolute; left: 0; right: 0; background: rgba(255,0,0,.35); z-index: 9; }
  body.repere .page::before { top: 0; height: 250px; } body.repere .page::after { bottom: 0; height: 340px; }
</style>
</head>
<body>
<div class="page">
  <div class="bande b1"></div><div class="bande b2"></div>
  <div class="zone">
    <div class="date">Samedi 14&nbsp;novembre&nbsp;2026</div>
    <h1>Portes ouvertes à&nbsp;<span>l’atelier</span></h1>
    <div class="infos">
      <strong>[heure de début] – [heure de fin]</strong><br>
      Atelier Forlife, montée du Collège Saint&nbsp;Cyrille, Bingerville<br>
      Venez voir l’impression DTF en&nbsp;direct.
    </div>
    <div class="cta">Réservez sur WhatsApp&nbsp;: 05&nbsp;85&nbsp;80&nbsp;18&nbsp;56</div>
    <!-- Logo officiel injecté par le moteur (assets/logo/logo-horizontal.svg) -->
    <img class="logo" data-forlife-logo="horizontal" data-sans-slogan alt="Forlife Com'">
  </div>
</div>
</body>
</html>
