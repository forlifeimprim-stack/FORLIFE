<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Post promo — modèle Forlife</title>
<!--
  MODÈLE « post promo » 1080×1350 (format post). Copier dans le dossier du projet puis modifier les textes.
  Rendu : node .claude/skills/visuel-studio/scripts/rendre.mjs post.html post.png --format post
  Règles : 1 message, 1 offre, 1 appel à l'action. Titre ≤ 7 mots. Texte total ≤ 20 % de la surface.
  Pour un client : remplacer les variables de couleur par sa charte (clients/<client>/brand-profile.md).
-->
<style>
  :root {
    --accent: #EA7822;      /* orange Forlife */
    --accent-2: #D9AC4E;    /* or prestige */
    --fond: #1A1A1A;        /* charbon */
    --fond-chaud: #2D1C14;  /* brun chaud */
    --clair: #F9F6F2;       /* crème */
  }
  body { font-family: 'Poppins', sans-serif; background: var(--fond); color: var(--clair); }
  .page { position: relative; width: 1080px; height: 1350px; overflow: hidden;
          background: radial-gradient(120% 80% at 85% 10%, #4a2a16 0%, var(--fond-chaud) 35%, var(--fond) 75%); }
  /* Formes de la marque (reprises du symbole du logo) */
  .forme { position: absolute; background: var(--accent); border-radius: 999px; }
  .f1 { width: 520px; height: 110px; right: -200px; top: 60px; opacity: .95; }
  .f2 { width: 300px; height: 110px; right: -190px; top: 200px; border-radius: 40px 60px 60px 40px; opacity: .55; }
  .f3 { width: 150px; height: 150px; right: 70px; top: 640px; opacity: .35; }

  .contenu { position: absolute; left: 80px; right: 80px; top: 120px; }
  .surtitre { display: inline-block; font-weight: 600; font-size: 30px; letter-spacing: .12em; text-transform: uppercase;
              color: var(--accent); border: 3px solid var(--accent); border-radius: 999px; padding: 10px 28px; }
  h1 { font-weight: 800; font-size: 112px; line-height: 1.02; margin: 48px 0 0; letter-spacing: -.02em; max-width: 820px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sous-titre { font-weight: 400; font-size: 38px; line-height: 1.35; margin-top: 36px; max-width: 760px; color: #e9e1d8; }

  .offre { position: absolute; left: 80px; top: 860px; display: flex; align-items: baseline; gap: 22px;
           background: var(--clair); color: var(--fond); border-radius: 28px; padding: 26px 40px; }
  .offre .montant { font-weight: 800; font-size: 76px; color: var(--accent); }
  .offre .detail { font-weight: 600; font-size: 30px; line-height: 1.2; }

  .cta { position: absolute; left: 80px; right: 80px; bottom: 150px; height: 110px; border-radius: 999px; background: var(--accent);
         display: flex; align-items: center; justify-content: center; gap: 20px; font-weight: 700; font-size: 40px; color: #fff; }
  .cta svg { width: 52px; height: 52px; }

  .pied { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; align-items: center; justify-content: space-between;
          font-size: 24px; color: #cfc6bc; }
  .logo { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 34px; color: #fff; }
  .logo svg { height: 58px; width: auto; }
</style>
</head>
<body>
<div class="page">
  <div class="forme f1"></div><div class="forme f2"></div><div class="forme f3"></div>

  <div class="contenu">
    <span class="surtitre">Rentrée 2026</span>
    <h1>Des tee-shirts <em>qui tiennent</em> au lavage.</h1>
    <p class="sous-titre">Impression DTF haute définition pour votre école, votre église ou votre équipe. Livré en 72 h à Bingerville.</p>
  </div>

  <div class="offre">
    <span class="montant">[prix]</span>
    <span class="detail">FCFA / pièce<br>dès 20 pièces</span>
  </div>

  <div class="cta">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>
    WhatsApp : 05 85 80 18 56
  </div>

  <div class="pied">
    <div class="logo">
      <!-- Symbole du logo Forlife (assets/logo/logo-horizontal.svg) -->
      <svg viewBox="20 50 175 190" aria-hidden="true"><g fill="#EA7822"><circle cx="59.24" cy="209.06" r="25.45"/><path d="m59.23,55.5h112.07c9.44,0,17.09,7.65,17.09,17.09h0c0,16.06-13.02,29.08-29.08,29.08H47.23c-9.44,0-17.09-7.64-17.1-17.08h0c0-16.06,13.02-29.08,29.08-29.08Z"/><path d="m56.23,121.44h62.72c7.29,0,13.2,5.91,13.2,13.2v8.65c0,12.41-10.06,22.47-22.47,22.47h-62.69c-7.29,0-13.2-5.91-13.2-13.2v-8.65c0-12.4,10.04-22.45,22.44-22.47Z"/></g></svg>
      Forlife Com'
    </div>
    <span>Bingerville · Abidjan Est</span>
  </div>
</div>
</body>
</html>
