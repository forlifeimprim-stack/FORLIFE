<script>
// =====================================================================
//  Moteur seek(t) déterministe — aucun timer, aucun état entre images.
// =====================================================================
const DUR = window.DUR, C = window.CUES, FPS = 60, DROP = window.DROP;
const stage = document.getElementById('stage');
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const io = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const sio = k => k <= 0 ? 0 : k >= 1 ? 1 : -(Math.cos(Math.PI * k) - 1) / 2;
const out = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.pow(1 - k, 3);
const o5 = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.pow(1 - k, 5);
const inn = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * k;
const expo = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2;
const expoIn = k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, 10 * k - 10);
const P = (t, a, b, e = x => x) => e(clamp((t - a) / (b - a)));
function spring(tau, k = 170, d = 26) {
  if (tau <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * tau) * (Math.cos(wd * tau) + z * w0 / wd * Math.sin(wd * tau)); }
  return 1 - Math.exp(-w0 * tau) * (1 + w0 * tau);
}
const SP = { ui: [320, 30], box: [170, 26], heavy: [120, 24], pop: [260, 24] };
const sp = (t, t0, kind = 'box') => spring(t - t0, SP[kind][0], SP[kind][1]);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
const cue = (k, i) => C[k][i].t;
const punch = (t, times, amp, k = 7) => times.reduce((s, ti) => s + (t >= ti ? amp * Math.exp(-(t - ti) * k) : 0), 0);
function camAt(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1, 5);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const e = (b[5] || io)(clamp((t - a[0]) / (b[0] - a[0])));
      return [Math.exp(lerp(Math.log(a[1]), Math.log(b[1]), e)), lerp(a[2], b[2], e), lerp(a[3], b[3], e), lerp(a[4] || 0, b[4] || 0, e)]; }
  }
  return keys[keys.length - 1].slice(1, 5);
}
const applyCam = (el, [z, cx, cy, r]) => el.style.transform = `translate(960px,540px) scale(${z}) rotate(${r}deg) translate(${-cx}px,${-cy}px)`;
function el(tag, cls, parent, css = {}, html) { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e.style, css); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }
function sv(tag, parent, attrs = {}) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function svgLayer(parent, w = 1920, h = 1080, css = {}) { const s = sv('svg', parent, { width: w, height: h }); Object.assign(s.style, { position: 'absolute', left: 0, top: 0 }, css); return s; }
const img = p => `url(brand/img/${p})`;

// ---------- mots en masque ----------
const W = [], LATE = [];
// position d'un mot (coordonnées du parent de la ligne), mesurée une fois les polices chargées
function wbox(d, i) { const m = d.querySelectorAll('.m')[i]; const half = d.style.transform.includes('-50%') ? d.offsetWidth / 2 : 0; return { x: d.offsetLeft - half + m.offsetLeft, w: m.offsetWidth }; }
function line(parent, words, times, css, cls = '', outT = null, align = 'left') {
  const d = el('div', 'tl ' + cls, parent, css);
  if (align === 'center') { d.style.transform = 'translateX(-50%)'; d.style.textAlign = 'center'; }
  words.forEach((w, i) => {
    const m = el('span', 'm', d); const s = el('span', 'w', m, {}, w);
    W.push({ e: s, t0: times[i], out: outT === null ? null : outT + i * 0.03 });
    if (i < words.length - 1) d.appendChild(document.createTextNode(' '));
  });
  return d;
}
function updWords(t) {
  for (const o of W) {
    const p = spring(t - o.t0, 240, 27);
    let y = (1 - p) * 125, r = (1 - p) * 8, op = t < o.t0 ? 0 : 1;
    if (o.out !== null && t > o.out) { const q = inn(clamp((t - o.out) / .3)); y = -135 * q; r = -5 * q; }
    o.e.style.transform = `translateY(${y}%) rotate(${r}deg)`; o.e.style.opacity = op;
  }
}

// ---------- trait de marqueur dessiné à la main ----------
const MK = [];
function marker(svg, pts, t0, dur, color = 'var(--orange)', width = 12, seed = 1, jit = 5) {
  const R = mulberry32(seed);
  const p = pts.map(([x, y]) => [x + (R() - .5) * jit, y + (R() - .5) * jit]);
  let d = `M ${p[0][0]} ${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];
    d += ` C ${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
  }
  const path = sv('path', svg, { d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .95 });
  const len = path.getTotalLength(); path.setAttribute('stroke-dasharray', len + ' ' + len); path.setAttribute('stroke-dashoffset', len);
  const o = { path, len, t0, dur }; MK.push(o); return o;
}
function updMarkers(t) { for (const m of MK) m.path.setAttribute('stroke-dashoffset', m.len * (1 - P(t, m.t0, m.t0 + m.dur, sio))); }
const ellipsePts = (cx, cy, rx, ry, turns = 1.12, n = 28, a0 = -2.2) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + i / n * Math.PI * 2 * turns; return [cx + rx * Math.cos(a) * (1 + 0.03 * i / n), cy + ry * Math.sin(a)]; });

// ---------- personnage pictogramme (composant) ----------
const SKIN = ['#7a4a2e', '#8d5a3b', '#5e3a24', '#9a6440', '#6c4129'];
function person(svg, x, y, o = {}) {
  const s = o.scale || 1, g = sv('g', svg), inner = sv('g', g);
  const skin = o.skin || SKIN[0], cloth = o.cloth || '#cdb9a0', pants = o.pants || '#5b4636';
  const parts = { g, inner, x, y, s, cloth: [] };
  // jambes
  if (o.dress) {
    sv('rect', inner, { x: -24, y: -60, width: 18, height: 60, rx: 9, fill: skin }); sv('rect', inner, { x: 6, y: -60, width: 18, height: 60, rx: 9, fill: skin });
    const dr = sv('path', inner, { d: 'M -50 -212 Q 0 -226 50 -212 L 74 -52 Q 0 -36 -74 -52 Z', fill: cloth }); parts.cloth.push(dr);
  } else {
    sv('rect', inner, { x: -30, y: -112, width: 26, height: 112, rx: 12, fill: pants }); sv('rect', inner, { x: 4, y: -112, width: 26, height: 112, rx: 12, fill: pants });
    const tor = sv('path', inner, { d: 'M -52 -206 Q 0 -222 52 -206 L 48 -96 Q 0 -86 -48 -96 Z', fill: cloth }); parts.cloth.push(tor);
  }
  // bras (groupes pivotant à l'épaule)
  const mkArm = (side) => { const a = sv('g', inner, { transform: `translate(${side * 50},-200)` }); const r = sv('g', a); sv('rect', r, { x: -13, y: -6, width: 26, height: 116, rx: 13, fill: cloth }); sv('circle', r, { cx: 0, cy: 112, r: 14, fill: skin }); parts.cloth.push(r.firstChild); return r; };
  parts.armL = mkArm(-1); parts.armR = mkArm(1);
  sv('rect', inner, { x: -11, y: -232, width: 22, height: 26, fill: skin });
  sv('circle', inner, { cx: 0, cy: -262, r: 38, fill: skin });
  if (o.wrap) { const w = sv('path', inner, { d: 'M -44 -270 Q -40 -324 4 -322 Q 52 -320 46 -276 Q 20 -292 -44 -270 Z', fill: o.wrap }); sv('path', inner, { d: 'M 30 -312 Q 62 -330 58 -296 Z', fill: o.wrap }); }
  else sv('path', inner, { d: 'M -38 -268 Q -40 -304 0 -302 Q 40 -304 38 -268 Q 20 -282 -38 -268 Z', fill: '#2a1a12' });
  g.setAttribute('transform', `translate(${x},${y}) scale(${s})`);
  return parts;
}
function pose(p, { x = p.x, y = p.y, bob = 0, sway = 0, armL = 8, armR = -8, sc = 1, op = 1 }) {
  p.g.setAttribute('transform', `translate(${x},${y - bob}) scale(${p.s * sc})`);
  p.inner.setAttribute('transform', `rotate(${sway})`);
  p.armL.setAttribute('transform', `rotate(${armL})`); p.armR.setAttribute('transform', `rotate(${armR})`);
  p.g.setAttribute('opacity', op);
}
// flamme (motif)
function flame(svg) {
  const g = sv('g', svg); const f = sv('g', g);
  sv('circle', f, { cx: 0, cy: -10, r: 46, fill: 'rgba(255,190,90,.28)' });
  sv('path', f, { d: 'M 0 -78 C 26 -44 30 -20 22 -2 C 16 12 -16 12 -22 -2 C -30 -20 -18 -44 0 -78 Z', fill: '#F2A33A' });
  sv('path', f, { d: 'M 0 -46 C 12 -28 14 -16 10 -6 C 6 2 -6 2 -10 -6 C -14 -16 -10 -28 0 -46 Z', fill: '#FFE9A8' });
  return { g, f };
}
function placeFlame(fl, x, y, s, t, op = 1) {
  const fk = 1 + 0.08 * Math.sin(t * 17) + 0.05 * Math.sin(t * 29 + 1);
  fl.g.setAttribute('transform', `translate(${x},${y}) scale(${s})`); fl.f.setAttribute('transform', `scale(${1 / fk * 1.04},${fk}) rotate(${3 * Math.sin(t * 11)})`);
  fl.g.setAttribute('opacity', op);
}

// ---------- ambiance : nuages de couleur + poussières de lumière ----------
function clouds(parent, seed, cols) {
  const R = mulberry32(seed);
  return cols.map((c, i) => ({ e: el('div', 'abs', parent, { width: '1400px', height: '1400px', left: 0, top: 0, background: `radial-gradient(circle, ${c} 0%, rgba(255,255,255,0) 62%)` }),
    x: R() * 1920 - 700, y: R() * 1080 - 700, ax: 160 + R() * 200, ay: 90 + R() * 120, w: 0.12 + R() * 0.18, ph: R() * 6 }));
}
const updClouds = (cl, t) => cl.forEach(c => c.e.style.transform = `translate(${c.x + c.ax * Math.sin(t * c.w + c.ph)}px,${c.y + c.ay * Math.cos(t * c.w * 1.3 + c.ph)}px)`);
function motes(parent, seed, n, area = [1920, 1080], col = '255,236,180') {
  const R = mulberry32(seed);
  return Array.from({ length: n }, () => { const r = 3 + R() * 11;
    return { e: el('div', 'abs', parent, { width: r * 2 + 'px', height: r * 2 + 'px', borderRadius: '50%', background: `radial-gradient(circle, rgba(${col},.95), rgba(${col},0) 70%)` }),
      x: R() * area[0], y: R() * area[1], v: 12 + R() * 30, ph: R() * 6, tw: 1 + R() * 2 }; });
}
const updMotes = (ms, t, H = 1080) => ms.forEach(m => { const y = ((m.y - m.v * t) % (H + 60) + H + 60) % (H + 60) - 30;
  m.e.style.transform = `translate(${m.x + 20 * Math.sin(t * .5 + m.ph)}px,${y}px)`; m.e.style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * m.tw + m.ph)); });
function rays(parent, cx, cy, size, alpha, col = '232,170,70') {
  return el('div', 'abs', parent, { left: (cx - size / 2) + 'px', top: (cy - size / 2) + 'px', width: size + 'px', height: size + 'px',
    background: `repeating-conic-gradient(from 0deg, rgba(${col},0) 0deg 3deg, rgba(${col},${alpha}) 3.6deg 5.4deg, rgba(${col},0) 6deg 10deg)`,
    WebkitMaskImage: 'radial-gradient(circle, #000 0%, rgba(0,0,0,.7) 18%, transparent 50%)', maskImage: 'radial-gradient(circle, #000 0%, rgba(0,0,0,.7) 18%, transparent 50%)' });
}

// ============================== SCÈNES ===============================
const S = {};
function scene(name, a, b, bg) { const L = el('div', 'L', stage, { background: bg || 'var(--cream)' }); L.dataset.a = a; L.dataset.b = b; S[name] = L; return L; }
const big = (sz, extra = {}) => Object.assign({ fontFamily: 'Fraunces', fontWeight: 800, fontSize: sz + 'px', color: 'var(--brown)' }, extra);
const itl = (sz, extra = {}) => Object.assign({ fontFamily: 'Fraunces', fontStyle: 'italic', fontWeight: 600, fontSize: sz + 'px', color: 'var(--brown2)' }, extra);

// ---- 1 · Lever de soleil + salle qui se remplit (0 → 6,75) ----
{
  const L = scene('s1', 0, 6.75);
  const Wd = el('div', 'world', L, { width: '3400px' }); S.s1w = Wd;
  S.s1cl = clouds(Wd, 3, ['rgba(242,190,110,.55)', 'rgba(208,101,31,.22)', 'rgba(47,125,91,.14)', 'rgba(242,200,120,.45)', 'rgba(208,101,31,.18)']);
  S.s1cl.forEach((c, i) => { c.x += i * 520; });
  S.s1pat = el('div', 'pat', Wd, { left: '-200px', top: '-200px', width: '3800px', height: '1500px', background: 'rgba(170,110,40,.07)' });
  S.s1sun = el('div', 'abs', Wd, { left: '160px', top: '-60px', width: '1000px', height: '1000px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,226,150,1) 0%, rgba(250,200,110,.75) 30%, rgba(248,190,100,0) 68%)' });
  S.s1rays = rays(Wd, 660, 470, 2600, .18);
  S.s1emb = el('div', 'abs', Wd, { left: '450px', top: '250px', width: '420px', height: '420px' });
  el('div', 'abs gold-mask', S.s1emb, { inset: '6px', WebkitMaskImage: img('nsoromma_frame.png'), maskImage: img('nsoromma_frame.png'), filter: 'blur(18px)', opacity: .55 });
  S.s1gold = el('div', 'abs gold-mask', S.s1emb, { inset: 0, WebkitMaskImage: img('nsoromma_frame.png'), maskImage: img('nsoromma_frame.png') });
  S.s1cross = el('div', 'abs', S.s1emb, { left: '210px', top: '210px', width: 0, height: 0 });
  const crs = { position: 'absolute', background: '#fffaf0', borderRadius: '5px', boxShadow: '0 0 18px 6px rgba(255,220,150,.95), 0 0 60px 18px rgba(255,190,90,.55)' };
  el('div', '', S.s1cross, Object.assign({ left: '-11px', top: '-66px', width: '22px', height: '132px' }, crs));
  el('div', '', S.s1cross, Object.assign({ left: '-44px', top: '-34px', width: '88px', height: '22px' }, crs));
  const T1 = C['01'];
  line(Wd, ['Avant', 'de', 'monter', 'au', 'ciel,'], T1.slice(0, 5).map(x => x.t), big(92, { left: '1000px', top: '330px' }));
  line(Wd, ['Jésus', 'n’a', 'pas', 'demandé'], T1.slice(5, 9).map(x => x.t), itl(70, { left: '1004px', top: '470px' }));
  line(Wd, ['à', 'ses', 'disciples'], T1.slice(9, 12).map(x => x.t), itl(70, { left: '1004px', top: '565px', color: 'rgba(107,58,28,.75)' }));
  // salle de chaises
  const hs = svgLayer(Wd, 3400, 1080); S.chairs = [];
  const R = mulberry32(21);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 11; c++) {

  line(tx, ['Église', 'CMA', 'de', 'Côte', 'd’Ivoire'], [43.5, 43.55, 43.6, 43.65, 43.7], { left: X + 'px', top: '666px', fontSize: '30px', fontWeight: 500, color: 'var(--brown2)' }, '', 44.18);
  // citation + carton final
  line(tx, ['«&nbsp;Moi', 'et', 'ma', 'maison,'], [T12[0].t, T12[1].t, T12[2].t, T12[3].t], itl(68, { left: X + 'px', top: '250px', color: 'var(--brown)' }));
  line(tx, ['nous', 'servirons', '<span style="color:var(--orange)">l’Éternel.&nbsp;»</span>'], [T12[4].t, T12[5].t, T12[6].t], itl(68, { left: X + 'px', top: '340px', color: 'var(--brown)' }));
  line(tx, ['JOSUÉ', '24:15'], [47.1, 47.16], { left: X + 'px', top: '470px', fontSize: '28px', color: 'var(--orange)' }, 'caps');
  S.endRule = el('div', 'abs', tx, { left: X + 'px', top: '580px', width: '160px', height: '5px', borderRadius: '3px', background: 'var(--orange)', transformOrigin: '0 50%', transform: 'scaleX(0)' });
  line(tx, ['MANUEL', 'DE', 'FORMATION', 'DES', 'MENTORS'], [47.75, 47.8, 47.85, 47.9, 47.95], { left: X + 'px', top: '620px', fontSize: '28px', color: 'var(--brown)' }, 'caps');
  line(tx, ['École', 'des', 'Disciples', '·', 'Première', 'édition', '2026'], [48.15, 48.2, 48.25, 48.3, 48.4, 48.45, 48.5], itl(42, { left: X + 'px', top: '680px', color: 'var(--brown2)' }));
  S.s7flame = flame(svgLayer(Wd));
}
S.flash = el('div', 'L', stage, { background: 'radial-gradient(circle at 50% 50%, #fffcf2, #fbe4ad)', opacity: 0 });

// ============================== SEEK =================================
const ORDER = ['s1', 's2', 's3', 's4', 's5', 's6', 's7'];
window.seek = async (t) => {
  t = clamp(t, 0, DUR);
  for (const k of ORDER) { const L = S[k]; L.style.visibility = (t >= +L.dataset.a && t < +L.dataset.b) ? 'visible' : 'hidden'; }
  updWords(t); updMarkers(t);

  // ---- 1 ----
  if (t < 6.75) {
    const K = [[0, 1.12, 700, 520, -1], [3.9, 1.0, 960, 540, 0, sio], [4.85, 1.0, 2640, 560, 0, io], [6.2, 1.04, 2700, 560, 0, x => x], [6.75, 1.0, 2700, 560, 0]];
    applyCam(S.s1w, camAt(K, t));
    updClouds(S.s1cl, t);
    const rise = P(t, 0, 3.0, o5);
    S.s1sun.style.transform = `translateY(${(1 - rise) * 380}px) scale(${0.8 + 0.2 * rise})`;
    S.s1rays.style.opacity = P(t, 0.4, 2.4, io); S.s1rays.style.transform = `rotate(${t * 4}deg)`;
    const e = sp(t, 0.35, 'heavy');
    S.s1emb.style.transform = `translateY(${-8 * Math.sin(t * 1.4)}px) scale(${0.4 + 0.6 * e}) rotate(${(1 - e) * -40 + 2 * Math.sin(t)}deg)`;
    S.s1emb.style.clipPath = `circle(${P(t, 0.3, 1.5, o5) * 72}% at 50% 50%)`;
    S.s1emb.style.setProperty('--sh', (lerp(-30, 130, (t * 0.35) % 1)) + '%');
    const c = sp(t, cue('01', 4), 'pop'); S.s1cross.style.transform = `scale(${c})`; S.s1cross.style.opacity = P(t, cue('01', 4) - .05, cue('01', 4) + .2);
    S.s1pat.style.transform = `translate(${-t * 14}px,0)`;
    for (const ch of S.chairs) { const a = sp(t, ch.t0, 'pop'); ch.g.setAttribute('transform', `translate(${ch.x},${ch.y - (1 - a) * 60}) scale(${ch.s * a})`); ch.g.setAttribute('opacity', P(t, ch.t0, ch.t0 + .08)); }
  }

  // ---- 2 ----
  if (t >= 6.4 && t < 9.75) {
    const pk = punch(t, [cue('02', 5)], 0.05, 6);
    const thr = P(t, 9.05, 9.72, expoIn);           // push-through dans la lettre « I »
    const z = (1.06 - 0.06 * P(t, 6.4, 7.6, o5)) * (1 + 0.03 * P(t, 7.6, 9.0, x => x)) + pk;
    applyCam(S.s2w, [z * Math.exp(Math.log(28) * thr), lerp(960, 812, P(t, 9.0, 9.4, io)), lerp(540, 595, P(t, 9.0, 9.4, io)), 0]);
    updClouds(S.s2cl, t);
    S.s2.style.opacity = P(t, 6.4, 6.75);
    const b = spring(t - cue('02', 5), 230, 26);
    S.s2word.style.transform = `translateX(-50%) scale(${lerp(1.5, 1, b)})`;
    S.s2word.style.opacity = P(t, cue('02', 5), cue('02', 5) + .1);
    const win = P(t, 8.35, 8.95, io);
    S.s2solid.style.opacity = 1 - win; S.s2win.style.opacity = win;
    S.s2win.style.backgroundPosition = `${t * 40}px 0, 0 0`;
    S.s2kente.style.transform = `scaleX(${P(t, 8.1, 8.6, o5)})`;
    S.s2flash.style.opacity = P(t, 9.4, 9.72, inn);
  }

  // ---- 3 ----
  if (t >= 9.5 && t < 14.7) {
    const last = S.relay[S.relay.length - 1];
    const lx = last.x, ly = last.y - 290 * 0.42;
    const tr = P(t, 9.5, 13.8, x => x);
    applyCam(S.s3w, [1.0 + 0.04 * tr, lerp(1320, 1080, sio(tr)), 540, 0]);
    updClouds(S.s3cl, t);
    S.s3.style.opacity = 1;
    S.rows.forEach((r, i) => r.g.style.transform = `translateX(${(1 - r.depth) * lerp(-240, 240, sio(tr))}px)`);
    S.s3l1.style.opacity = 1 - 0.5 * P(t, 12.1, 12.4);
    for (const c of S.crowd) {
      const a = sp(t, c.t0, 'pop');
      const lit = c.tLit !== undefined ? P(t, c.tLit, c.tLit + .25, out) : 0;
      if (c.tLit !== undefined) c.p.cloth.forEach(e => e.setAttribute('fill', lit > .5 ? c.col : '#CDB9A0'));
      pose(c.p, { y: c.y - (1 - a) * 40, bob: 3 * Math.sin(t * 2.2 + c.ph) + lit * 14 * c.p.s, sc: a * (1 + 0.1 * lit), armR: -8 - lit * 150 * (1 - P(t, (c.tLit || 0) + .35, (c.tLit || 0) + .7, io)), armL: 8, op: P(t, c.t0, c.t0 + .1) });
    }
    // la flamme saute de main en main (arcs)
    const relay = S.relay; let fx = relay[0].x, fy = relay[0].y - 330 * relay[0].p.s, fs = 0;
    if (t >= 12.85) {
      fs = P(t, 12.85, 13.05, out);
      for (let k = 0; k < relay.length - 1; k++) {
        const a = relay[k], b = relay[k + 1], t0 = a.tLit + 0.02, t1 = b.tLit;
        const ax = a.x + (S.rows[a.r].depth - 1) * 0, ay = a.y - 330 * a.p.s, bx = b.x, by = b.y - 330 * b.p.s;
        if (t >= t0) { const q = P(t, t0, t1, io); fx = lerp(ax, bx, q); fy = lerp(ay, by, q) - Math.sin(q * Math.PI) * 110; }
      }
    }
    placeFlame(S.s3flame, fx, fy, 0.55 * fs, t, fs);
    // ligne pointillée de relais
    const pts = relay.map(c => [c.x, c.y - 330 * c.p.s]);
    if (!S.relayPath) { let d = `M ${pts[0][0]} ${pts[0][1]}`; for (let i = 1; i < pts.length; i++) { const mx = (pts[i - 1][0] + pts[i][0]) / 2, my = Math.min(pts[i - 1][1], pts[i][1]) - 110; d += ` Q ${mx} ${my} ${pts[i][0]} ${pts[i][1]}`; }
      S.relayPath = sv('path', S.relayLine, { d, fill: 'none', stroke: '#D9A441', 'stroke-width': 5, 'stroke-dasharray': '2 14', 'stroke-linecap': 'round' }); S.relayLen = S.relayPath.getTotalLength(); }
    const rk = P(t, 13.0, 13.0 + 0.17 * (relay.length - 1), x => x);
    S.relayPath.style.clipPath = 'none'; S.relayPath.setAttribute('opacity', rk > 0 ? .9 : 0);
    S.relayPath.setAttribute('stroke-dasharray', `2 14`); S.relayPath.style.strokeDashoffset = 0;
    S.relayPath.setAttribute('stroke-dasharray', rk < 1 ? `${S.relayLen * rk} ${S.relayLen}` : '2 14');
  }

  // ---- 4 ----
  if (t >= 14.3 && t < 19.6) {
    // iris focal depuis la flamme (scène 3) : on ouvre un cercle sur la scène 4
    const ir = P(t, 14.3, 14.75, io);
    S.s4.style.clipPath = ir < 1 ? `circle(${ir * 2300}px at 1380px 600px)` : 'none';
    const thr = P(t, 18.95, 19.55, expoIn);          // push-through dans la fenêtre éclairée
    const base = camAt([[14.3, 1.08, 1000, 560, 0], [18.9, 1.0, 960, 540, 0, sio]], t);
    const wx = S.hx + 185, wy = S.hy - 305;
    applyCam(S.s4w, [base[0] * Math.exp(Math.log(22) * thr), lerp(base[1], wx, P(t, 18.9, 19.3, io)), lerp(base[2], wy, P(t, 18.9, 19.3, io)), 0]);
    updClouds(S.s4cl, t);
    S.s4sun.style.transform = `scale(${1 + 0.05 * Math.sin(t * 1.2)})`;
    S.fam.forEach((f, i) => {
      if (i === 0) { pose(f.p, { bob: 3 * Math.sin(t * 2), armR: -8 - 140 * P(t, 14.6, 15.0, out) * (1 - P(t, 18.2, 18.6, io)), sc: 1 }); return; }
      const w = P(t, f.t0, f.t0 + 1.1, out);
      const walking = w > 0 && w < 0.98;
      pose(f.p, { x: lerp(f.from, f.to, w), bob: walking ? 10 * f.p.s * Math.abs(Math.sin(t * 9 + i)) : 3 * Math.sin(t * 2 + i), sway: walking ? 3 * Math.sin(t * 9 + i) : 0,
        armL: walking ? 22 * Math.sin(t * 9 + i) : 8, armR: walking ? -22 * Math.sin(t * 9 + i) : -8, op: P(t, f.t0, f.t0 + .2) });
    });
    // flamme : dans la main, puis elle monte allumer la fenêtre (motif)
    const m = cue('04', 11);
    const hand = [S.hx - 30 + 125 * 0.92, S.hy - 330 * 0.92];
    const go = P(t, m - 0.45, m, io);
    const fx = lerp(hand[0], S.hx + 185, go), fy = lerp(hand[1], S.hy - 305, go) - Math.sin(go * Math.PI) * 120;
    placeFlame(S.s4flame, fx, fy, 0.6 * (1 - 0.4 * go), t, 1 - P(t, m, m + .2));
    S.win.style.opacity = P(t, m - .05, m + .25, out); S.houseFill.style.opacity = P(t, m, m + .5, out) * 0.9;
    const h = sp(t, m + 0.05, 'pop'); S.heart.style.opacity = P(t, m, m + .1); S.heart.style.transform = `scale(${h}) rotate(${(1 - h) * -25}deg)`;
  }

  // ---- 5 ----
  if (t >= 19.3 && t < 28.9) {
    const K = [[19.3, 1.6, PX[0] + 160, 540, 0], [20.2, 1.0, PX[0], 540, 0, o5], [22.0, 1.02, PX[0] + 30, 540, 0, x => x], [22.5, 1.0, PX[1], 540, 0, expo],
      [24.5, 1.02, PX[1] + 30, 540, 0, x => x], [25.0, 1.0, PX[2], 540, 0, expo], [27.3, 1.03, PX[2] + 20, 540, 0, x => x], [28.0, 0.42, PX[1], 540, 0, io], [28.9, 0.40, PX[1] + 40, 540, 0, x => x]];
    const cam = camAt(K, t); const pk = punch(t, [20.0, 22.5, 25.0], 0.025, 6); cam[0] += pk;
    applyCam(S.s5w, cam);
    updClouds(S.s5cl, t);
    S.s5.style.opacity = 1;
    S.fg.style.opacity = 1 - P(t, 27.3, 27.8);
    S.fgSym.forEach((f, i) => { const x = f.x - (cam[1] - PX[0]) * 1.4; f.e.style.transform = `translate(${x}px,${f.y + 14 * Math.sin(t + i)}px) rotate(${t * 20 + i * 40}deg)`; });
    S.blocks.forEach((b, bi) => {
      b.digs.forEach(d => { const k = P(t, b.tNum - 0.42 + d.i * 0.08, b.tNum + 0.12 + d.i * 0.08, o5); d.strip.style.transform = `translateY(${-k * d.n * 1.08}em)`; });
      const s = sp(t, b.tNum + 0.05, 'pop');
      b.sy.style.transform = `scale(${s}) rotate(${(1 - s) * -160 + 8 * Math.sin(t * 1.3 + bi)}deg)`;
      b.glow.style.transform = `scale(${0.6 + 0.4 * P(t, b.tNum - .3, b.tNum + .5, out)})`;
    });
  }

  // ---- 6 ----
  if (t >= 28.4 && t < 37.45) {
    const sl = P(t, 28.4, 28.95, o5);             // travelling parallaxe : la scène entre par la droite
    applyCam(S.s6w, [1.0 + 0.05 * P(t, 28.9, 33.2, x => x) + 0.07 * P(t, 33.3, 37.0, x => x), 960 - (1 - sl) * 900, 540, 0]);
    S.s6.style.clipPath = sl < 1 ? `inset(0 0 0 ${(1 - sl) * 100}%)` : 'none';
    updClouds(S.s6cl, t);
    let ang = 0; S.drumCues.slice(1).forEach(c => ang += spring(t - c + 0.08, 200, 26));
    ang -= 1 - P(t, 28.9, 29.6, o5);               // le tambour arrive en tournant
    const exitD = P(t, 33.1, 33.6, inn);
    S.drum.style.transform = `rotateX(${ang * S.drumStep - exitD * 100}deg)`;
    S.drumWrap.style.opacity = (1 - exitD) * P(t, 28.9, 29.3);
    S.faces.forEach((f, i) => { const rel = ((i - ang) % 6 + 6) % 6; const d = Math.min(rel, 6 - rel); f.style.opacity = clamp(1 - d * 0.55); f.style.color = d < 0.5 ? 'var(--orange)' : 'var(--brown)'; });
    // une âme · un foyer
    const T9 = C['09'];
    const a = sp(t, T9[8].t - 0.1, 'pop');
    pose(S.soul, { sc: a, bob: 4 * Math.sin(t * 2.3), armR: -8 - 150 * P(t, T9[9].t, T9[9].t + .3, out), op: P(t, T9[8].t - .1, T9[8].t) });
    placeFlame(S.s6flame, 640 + 125 * 0.95, 860 - 330 * 0.95, 0.55 * P(t, T9[9].t + .1, T9[9].t + .35, out), t, P(t, T9[9].t + .1, T9[9].t + .2));
    S.s6win.style.opacity = P(t, T9[12].t + .5, T9[12].t + .8, out);
    S.s6white.style.opacity = P(t, 37.0, 37.42, inn);       // l'écran se vide avant le drop
  }

  // ---- 7 / 8 ----
  if (t >= 37.4) {
    const zd = 1 + punch(t, [DROP], 0.06, 3.5) + 0.04 * P(t, DROP, 52.5, x => x);
    applyCam(S.s7w, [zd, 960, 540, 0]);
    updClouds(S.s7cl, t); updMotes(S.s7motes, t);
    S.s7rays.style.transform = `rotate(${t * 3.5}deg) scale(${0.5 + 0.5 * spring(t - DROP, 120, 22)})`;
    S.s7pat.style.transform = `translate(${-t * 10}px, ${t * 5}px)`;
    // le livre arrive en tournant (une volte et demie) et révèle sa quatrième de couverture au passage
    const a = spring(t - DROP, 70, 17);
    const ry = lerp(-560, -22, a) + 16 * P(t, DROP + 1, 52.5, sio) + 2 * Math.sin(t * .9);
    const rx = lerp(20, 5, a) + 1.5 * Math.sin(t * .7);
    const sc = lerp(0.15, 1, spring(t - DROP, 110, 21));
    const move = P(t, 44.3, 45.2, io);
    S.bookPos.style.transform = `translate(${lerp(0, -60, move)}px, ${10 * Math.sin(t * 1.1)}px) scale(${sc * lerp(1, 0.94, move)})`;
    S.bookPos.style.opacity = P(t, DROP, DROP + .1);
    S.book.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    S.shadow.style.opacity = a;
    const g = t < 40.5 ? P(t, 39.0, 39.9, io) : t < 47.4 ? P(t, 40.7, 41.6, io) : P(t, 47.6, 48.6, io);
    S.glare.style.transform = `translateX(${lerp(-10, 75, g)}%)`; S.glare.style.opacity = g > 0 && g < 1 ? 1 : 0;
    S.kente.style.clipPath = `inset(0 ${100 - 100 * P(t, DROP + .1, DROP + .9, o5)}% 0 0)`; S.kente.style.backgroundPosition = `${-t * 40}px 0`;
    const au = sp(t, cue('11', 0) - 0.1, 'pop'), auOut = P(t, 44.1, 44.4, inn);
    S.author.style.transform = `scale(${au * (1 - auOut)}) rotate(${(1 - au) * -30}deg)`; S.author.style.opacity = P(t, cue('11', 0) - .1, cue('11', 0)) * (1 - auOut);
    S.endRule.style.transform = `scaleX(${P(t, 47.6, 48.1, o5)})`;
    S.s7mk.style.opacity = 1 - P(t, 41.85, 42.15);
    S.s7tx.style.transform = `translateY(${-6 * P(t, 45, 52.5, x => x)}px)`;
    // la flamme se pose au-dessus du livre pour la citation (motif, 3e apparition)
    const fl = P(t, 45.0, 45.6, o5);
    placeFlame(S.s7flame, 500, lerp(170, 140, fl), 0.6 * fl, t, fl);
  }
  // flash de passage 1 → 2
  S.flash.style.opacity = (t > 6.0 && t < 7.2) ? P(t, 6.2, 6.5, inn) * (1 - P(t, 6.5, 7.1, out)) : 0;
  document.getElementById('tc').textContent = t.toFixed(2);
};

// ---------- prévisualisation ----------
let playing = false, t0 = 0, cur = 0, wall = 0;
const aud = document.getElementById('aud');
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById('wrap').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
function loop(now) { if (!playing) return; cur = t0 + (now - wall) / 1000; if (cur >= DUR) { playing = false; cur = DUR; } window.seek(cur); requestAnimationFrame(loop); }
function play(from) { t0 = from; wall = performance.now(); playing = true; try { aud.currentTime = from; aud.play(); } catch (e) { } requestAnimationFrame(loop); }
addEventListener('keydown', e => {
  if (e.code === 'Space') { if (playing) { playing = false; aud.pause(); } else play(cur >= DUR ? 0 : cur); e.preventDefault(); }
  if (e.code === 'ArrowRight') { playing = false; aud.pause(); cur = Math.min(DUR, cur + 1 / FPS); window.seek(cur); }
  if (e.code === 'ArrowLeft') { playing = false; aud.pause(); cur = Math.max(0, cur - 1 / FPS); window.seek(cur); }
  if (e.code === 'KeyR') { cur = 0; play(0); }
});
Promise.all([document.fonts.ready, ...['cover_1280.jpg', 'back_1280.jpg', 'author.png', 'pattern.png', 'kente.jpg', 'nsoromma_frame.png', 'heart.png', 'gye_nyame.png', 'sankofa.png', 'dwennimmen.png', 'aya.png', 'sun.png', 'diamond.png', 'cross4.png', 'gold_knot.png']
  .map(f => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'brand/img/' + f; }))])
  .then(() => Promise.all(['900 100px Fraunces', '800 100px Fraunces', '600 100px Fraunces', 'italic 600 100px Fraunces', '500 20px Poppins', '600 20px Poppins'].map(f => document.fonts.load(f, 'AÉé’«»'))))
  .then(() => { LATE.forEach(f => f()); window.seek(0); window.ready = true; });
</script>
