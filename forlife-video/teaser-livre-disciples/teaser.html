:root{

<body>
<div id="wrap"><div id="stage"></div></div>
<div id="hud">Espace : lecture/pause · ←/→ : image · R : rejouer · <span id="tc">0.00</span> s</div>

<script src="cues.js"></script>
<script>
// ============================================================================
//  Moteur : tout est fonction de t, via window.seek(t). Aucun timer, aucun état.
// ============================================================================
const DUR = window.DUR, C = window.CUES, FPS = 60;
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const io = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const out = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.pow(1 - k, 3);
const o5 = k => k <= 0 ? 0 : k >= 1 ? 1 : 1 - Math.pow(1 - k, 5);
const inn = k => k <= 0 ? 0 : k >= 1 ? 1 : k * k * k;
const expo = k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2;
const P = (t, a, b, e = x => x) => e(clamp((t - a) / (b - a)));
// réponse indicielle analytique d'un ressort (masse 1, raideur k, amortissement d) — amortissement >= 0,72
function spring(tau, k = 170, d = 26) {
  if (tau <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * tau) * (Math.cos(wd * tau) + z * w0 / wd * Math.sin(wd * tau)); }
  return 1 - Math.exp(-w0 * tau) * (1 + w0 * tau);
}
const SP = { ui: [320, 30], box: [170, 26], heavy: [120, 24] };
const sp = (t, t0, kind = 'box') => spring(t - t0, SP[kind][0], SP[kind][1]);
// PRNG à graine (jamais Math.random)
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; } }
const cue = (k, i) => C[k][i].t;

// ---------- caméra : point visé (cx, cy), zoom interpolé en log, rotation ----------
function camAt(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1, 5);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) {
      const e = (b[5] || io)(clamp((t - a[0]) / (b[0] - a[0])));
      return [Math.exp(lerp(Math.log(a[1]), Math.log(b[1]), e)), lerp(a[2], b[2], e), lerp(a[3], b[3], e), lerp(a[4] || 0, b[4] || 0, e)];
    }
  }
  return keys[keys.length - 1].slice(1, 5);
}
function applyCam(el, [z, cx, cy, r], ox = 540, oy = 960) {
  el.style.transform = `translate(${ox}px,${oy}px) scale(${z}) rotate(${r}deg) translate(${-cx}px,${-cy}px)`;
}
// punch : impulsions qui décroissent exponentiellement
const punch = (t, times, amp, k = 7) => times.reduce((s, ti) => s + (t >= ti ? amp * Math.exp(-(t - ti) * k) : 0), 0);

// ---------- construction DOM ----------
function el(tag, cls, parent, css = {}, html) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  Object.assign(e.style, css); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e;
}
const W = []; // mots animés : {e, t0, out, dir}
// ligne de texte : mots dans des masques, chaque mot entre à son temps
function line(parent, words, times, css, cls = '', outT = null, outDir = -1) {
  const d = el('div', 'ctr ' + cls, parent, css);
  words.forEach((w, i) => {
    const m = el('span', 'm', d); const s = el('span', 'w', m, {}, w);
    W.push({ e: s, t0: times[i], out: outT === null ? null : outT + i * 0.035, dir: outDir });
    if (i < words.length - 1) d.appendChild(document.createTextNode(' '));
  });
  return d;
}
function updWords(t) {
  for (const o of W) {
    const p = spring(t - o.t0, 260, 28);
    let y = (1 - p) * 125, r = (1 - p) * 7, op = t < o.t0 ? 0 : 1;
    if (o.out !== null && t > o.out) { const q = inn(clamp((t - o.out) / .32)); y = 135 * q * o.dir; r = -4 * q; }
    o.e.style.transform = `translateY(${y}%) rotate(${r}deg)`;
    o.e.style.opacity = op;
  }
}
const img = (p) => `url(brand/img/${p})`;

// ============================== SCÈNES ======================================
const S = {};
function scene(name, a, b, bg) { const L = el('div', 'L', stage, { background: bg || 'transparent' }); L.dataset.a = a; L.dataset.b = b; S[name] = L; return L; }

// ---- S1 : la lumière s'ouvre (0 → 6,8) ----
{
  const L = scene('s1', 0, 6.8, 'var(--night)');
  const Wd = el('div', 'world', L); S.s1w = Wd;
  S.s1glow = el('div', 'abs', Wd, { left: '-460px', top: '-240px', width: '2000px', height: '2000px',
    background: 'radial-gradient(circle at 50% 50%, rgba(255,214,140,.55) 0%, rgba(214,140,50,.28) 16%, rgba(90,40,12,.25) 34%, rgba(20,9,4,0) 60%)' });
  S.s1rays = el('div', 'abs', Wd, { left: '-760px', top: '-540px', width: '2600px', height: '2600px',
    background: 'repeating-conic-gradient(from 0deg, rgba(255,222,160,0) 0deg 3.2deg, rgba(255,222,160,.30) 3.8deg 4.3deg, rgba(255,222,160,0) 4.9deg 9deg)',
    WebkitMaskImage: 'radial-gradient(circle, #000 0%, rgba(0,0,0,.8) 12%, transparent 46%)', maskImage: 'radial-gradient(circle, #000 0%, rgba(0,0,0,.8) 12%, transparent 46%)' });
  S.s1spark = el('div', 'abs', Wd, { left: '540px', top: '760px', width: '0', height: '0' });
  el('div', 'abs', S.s1spark, { left: '-160px', top: '-160px', width: '320px', height: '320px', borderRadius: '50%',
    background: 'radial-gradient(circle, #fff 0%, rgba(255,236,190,.9) 8%, rgba(255,200,110,.35) 30%, rgba(255,200,110,0) 70%)' });
  S.s1emb = el('div', 'abs', Wd, { left: '250px', top: '470px', width: '580px', height: '580px' });
  S.s1embGlow = el('div', 'abs gold-mask', S.s1emb, { inset: '0', WebkitMaskImage: img('nsoromma_frame.png'), maskImage: img('nsoromma_frame.png'), filter: 'blur(26px)', opacity: .7 });
  S.s1embGold = el('div', 'abs gold-mask', S.s1emb, { inset: '0', WebkitMaskImage: img('nsoromma_frame.png'), maskImage: img('nsoromma_frame.png') });
  S.s1cross = el('div', 'abs', S.s1emb, { left: '290px', top: '290px', width: 0, height: 0 });
  const crs = { position: 'absolute', background: '#fffaf0', borderRadius: '6px', boxShadow: '0 0 24px 6px rgba(255,236,190,.9), 0 0 80px 20px rgba(255,200,110,.6)' };
  el('div', '', S.s1cross, Object.assign({ left: '-14px', top: '-92px', width: '28px', height: '184px' }, crs));
  el('div', '', S.s1cross, Object.assign({ left: '-62px', top: '-48px', width: '124px', height: '28px' }, crs));
  const tx = el('div', 'abs', L, { left: 0, top: 0, width: '1080px', height: '1920px' }); S.s1tx = tx;
  const T1 = C['01'];
  const cs = { fontFamily: 'Fraunces', fontStyle: 'italic', fontWeight: 600, fontSize: '66px', color: 'var(--cream)' };
  line(tx, ['Avant', 'de', 'monter', 'au', 'ciel,'], T1.slice(0, 5).map(x => x.t), Object.assign({ top: '1330px' }, cs), '', 5.92);
  line(tx, ['Jésus', 'n’a', 'pas', 'demandé'], T1.slice(5, 9).map(x => x.t), Object.assign({ top: '1425px' }, cs), '', 5.98);
  line(tx, ['de', 'remplir', 'des', '<span style="color:var(--gold)">salles.</span>'], [T1[12].t, T1[13].t, T1[14].t, T1[15].t],
    Object.assign({ top: '1520px' }, cs), '', 6.04);
}

// ---- S2 : « Faites des disciples. » (6,2 → 9,8) ----
{
  const L = scene('s2', 6.2, 9.8, 'radial-gradient(circle at 50% 46%, #6b3714 0%, #3a1a0b 38%, #1b0c06 75%)');
  S.s2 = L;
  const Wd = el('div', 'world', L); S.s2w = Wd;
  S.s2pat = el('div', 'pat', Wd, { left: '-400px', top: '-400px', width: '1880px', height: '2720px', background: 'rgba(240,190,100,.07)' });
  S.s2rays = el('div', 'abs', Wd, { left: '-760px', top: '-340px', width: '2600px', height: '2600px',
    background: 'repeating-conic-gradient(from 2deg, rgba(255,222,160,0) 0deg 3.2deg, rgba(255,222,160,.20) 3.8deg 4.3deg, rgba(255,222,160,0) 4.9deg 9deg)',
    WebkitMaskImage: 'radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 10%, transparent 44%)', maskImage: 'radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 10%, transparent 44%)' });
  const T2 = C['02'];
  line(Wd, ['IL', 'A', 'DIT&nbsp;:'], [T2[0].t, T2[1].t, T2[2].t], { top: '700px', fontSize: '34px', color: 'var(--gold)' }, 'caps');
  line(Wd, ['«&nbsp;Faites', 'des'], [T2[3].t, T2[4].t], { top: '790px', fontFamily: 'Fraunces', fontStyle: 'italic', fontWeight: 600, fontSize: '96px', color: 'var(--cream)' });
  S.s2big = el('div', 'ctr ser', Wd, { top: '905px', fontWeight: 900, fontSize: '150px', letterSpacing: '-.01em', lineHeight: '1.1' });
  S.s2bigIn = el('span', 'goldtxt', S.s2big, { display: 'inline-block' }, 'DISCIPLES');
  el('span', '', S.s2big, { fontSize: '96px', color: 'var(--gold)', fontWeight: 600, marginLeft: '6px' }, '»').id = 's2q';
  line(Wd, ['MATTHIEU', '28:19'], [8.45, 8.52], { top: '1150px', fontSize: '28px', color: 'rgba(247,221,149,.8)' }, 'caps');
}

// ---- S3 : des membres… des disciples (9,3 → 14,9) ----
const HALL = { cols: 9, rows: 11, gap: 108, cx: 540, cy: 1180 };
{
  const L = scene('s3', 9.3, 14.9, 'radial-gradient(circle at 50% 62%, #3a1c0d 0%, #1d0e07 55%, #120804 100%)');
  S.s3 = L;
  const Wd = el('div', 'world', L); S.s3w = Wd;
  const persp = el('div', 'abs', Wd, { left: 0, top: 0, width: '1080px', height: '1920px', perspective: '1500px', perspectiveOrigin: `540px ${HALL.cy}px` });
  const plane = el('div', 'abs', persp, { left: (HALL.cx - 600) + 'px', top: (HALL.cy - 600) + 'px', width: '1200px', height: '1200px', transformStyle: 'preserve-3d' });
  S.s3plane = plane;
  S.dots = [];
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', 1200); svg.setAttribute('height', 1200); svg.style.position = 'absolute'; svg.style.left = 0; svg.style.top = 0; svg.style.overflow = 'visible';
  plane.appendChild(svg); S.s3svg = svg;
  const R = mulberry32(11);
  for (let r = 0; r < HALL.rows; r++) for (let c = 0; c < HALL.cols; c++) {
    const x = 600 + (c - 4) * HALL.gap + (r % 2 ? HALL.gap / 4 : -HALL.gap / 4) * 0, y = 600 + (r - 5) * HALL.gap;
    const d = el('div', 'abs', plane, { left: (x - 22) + 'px', top: (y - 22) + 'px', width: '44px', height: '44px', borderRadius: '50%', background: '#6d4632' });
    S.dots.push({ e: d, x, y, c, r, dist: Math.hypot(c - 4, r - 5), j: R() });
  }
  // chaîne de transmission (2 Tm 2:2) : du centre vers l'extérieur
  const chain = [[4, 5], [5, 4], [6, 2], [3, 3], [2, 1], [7, 6], [5, 8], [2, 7], [8, 9], [1, 9]];
  S.chain = chain.map(([c, r]) => S.dots.find(d => d.c === c && d.r === r));
  const links = [[0, 1], [1, 2], [0, 3], [3, 4], [0, 5], [5, 6], [0, 7], [6, 8], [7, 9], [2, 4]];
  S.links = links.map(([a, b], i) => {
    const A = S.chain[a], B = S.chain[b];
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    p.setAttribute('x1', A.x); p.setAttribute('y1', A.y); p.setAttribute('x2', B.x); p.setAttribute('y2', B.y);
    p.setAttribute('stroke', '#E8B654'); p.setAttribute('stroke-width', 6); p.setAttribute('stroke-linecap', 'round');
    const len = Math.hypot(B.x - A.x, B.y - A.y); p.setAttribute('stroke-dasharray', len); p.setAttribute('stroke-dashoffset', len);
    svg.appendChild(p); return { p, len, t0: 13.05 + i * 0.09 };
  });
  const tx = el('div', 'abs', L, { left: 0, top: 0, width: '1080px', height: '1920px' }); S.s3tx = tx;
  const T3 = C['03'];
  S.s3l1 = line(tx, ['Des', 'membres…'], [T3[4].t, T3[5].t], { top: '300px', fontFamily: 'Fraunces', fontWeight: 800, fontSize: '112px', color: 'var(--cream)' }, '', 14.0);
  S.s3strike = el('div', 'abs', tx, { left: '190px', top: '388px', width: '700px', height: '9px', borderRadius: '5px', background: 'var(--orange)', transformOrigin: '0 50%', transform: 'scaleX(0)' });
  line(tx, ['là', 'où', 'le', 'Seigneur', 'attendait'], T3.slice(6, 11).map(x => x.t), { top: '470px', fontSize: '42px', fontWeight: 500, color: 'rgba(251,243,228,.82)' }, '', 14.05);
  S.s3l3 = line(tx, ['des', '<span class="goldtxt">disciples.</span>'], [T3[11].t, T3[12].t], { top: '540px', fontFamily: 'Fraunces', fontStyle: 'italic', fontWeight: 600, fontSize: '128px', color: 'var(--gold)' }, '', 14.1);
}

// ---- S4 : la personne… la maison (14,2 → 19,1) ----
{
  const L = scene('s4', 14.2, 19.1, 'radial-gradient(circle at 50% 60%, #3a1c0d 0%, #1d0e07 55%, #120804 100%)');
  S.s4 = L;
  const Wd = el('div', 'world', L); S.s4w = Wd;

      f.e.style.transform = `scale(${a})`;
    }
    S.house.forEach((h, i) => h.p.setAttribute('stroke-dashoffset', h.len * (1 - P(t, 16.9 + i * 0.45, 17.9 + i * 0.45, io))));
    const m = cue('04', 11);
    S.s4fill.style.opacity = P(t, m - 0.05, m + 0.3, out);
    S.s4warm.style.opacity = P(t, m - 0.1, m + 0.4, out);
    const hh = sp(t, m, 'ui');
    S.s4heart.style.opacity = P(t, m, m + 0.15);
    S.s4heart.style.transform = `scale(${hh}) rotate(${(1 - hh) * -20}deg)`;
    const fl = P(t, 18.62, 18.98, io);
    S.s4flood.style.clipPath = `circle(${fl * Math.hypot(540, 1180) * 1.05}px at 540px 1030px)`;
  }

  // ---------- S5 / S6 : colonne crème ----------
  if (t >= 18.6 && t < 37.6) {
    const K = [
      [18.6, 1.25, 540, COL.b1 + 60, 0],
      [19.9, 1.0, 540, COL.b1, 0, o5],
      [21.95, 1.03, 540, COL.b1 + 20, 0, x => x],
      [22.45, 1.0, 540, COL.b2, 0, expo],
      [24.45, 1.03, 540, COL.b2 + 20, 0, x => x],
      [24.95, 1.0, 540, COL.b3, 0, expo],
      [28.2, 1.04, 540, COL.b3 + 30, 0, x => x],
      [28.8, 1.0, 540, COL.b4, 0, expo],
      [35.0, 1.06, 540, COL.b4 + 40, 0, x => x],
      [37.3, 1.08, 540, COL.b4 + 100, 0, io],
    ];
    const [z, cx, cy, r] = camAt(K, t);
    const pk = punch(t, [20.0, 22.5, 25.0], 0.02, 6);
    applyCam(S.s5w, [z + pk, cx, cy, r]);
    S.s5pat.style.transform = `translate(${-t * 10}px, 0)`;
    S.blocks.forEach((b, bi) => {
      b.digs.forEach(d => {
        const k = P(t, b.tNum - 0.45 + d.i * 0.08, b.tNum + 0.12 + d.i * 0.08, o5);
        d.strip.style.transform = `translateY(${-k * d.n * 1.08}em)`;
        d.strip.style.opacity = P(t, b.tNum - 0.5 + d.i * 0.08, b.tNum - 0.38 + d.i * 0.08);
      });
      const s = sp(t, b.tNum + 0.05, 'box');
      b.sy.style.transform = `scale(${s}) rotate(${(1 - s) * -120 + 6 * Math.sin(t * 1.3 + bi)}deg)`;
      b.glow.style.opacity = P(t, b.tNum - 0.2, b.tNum + 0.4, out) * (0.8 + 0.2 * Math.sin(t * 2));
    });
    S.who.forEach((w, k) => {
      const next = k < 3 ? S.who[k + 1].t : 99;
      w.d.style.color = (t >= w.t && t < next) ? 'var(--orange)' : 'var(--brown)';
    });
    const fl = P(t, 36.95, 37.32, io);
    S.s6flood.style.clipPath = `circle(${fl * Math.hypot(540, 1180) * 1.05}px at 540px 1180px)`;
  }

  // ---------- S7 / S8 : le livre ----------
  if (t >= 37.2) {
    const D = window.DROP;
    const zDrop = 1 + punch(t, [D], 0.05, 4) + 0.06 * P(t, D, 44.2, x => x);
    applyCam(S.s7w, [zDrop, 540, 960, 0]);
    const burst = spring(t - D, 120, 22);
    S.s7rays.style.transform = `rotate(${t * 3.2}deg) scale(${0.4 + 0.6 * burst})`;
    S.s7rays.style.opacity = t < D ? 0 : 0.55 + 0.45 * punch(t, [D], 1, 2.2);
    S.s7glow.style.opacity = t < D ? 0 : 0.75 + 0.25 * punch(t, [D, 40.76], 1, 2);
    S.s7pat.style.transform = `translate(${-t * 8}px, ${t * 6}px)`;
    S.s7pat.style.opacity = P(t, D, D + 1);
    // livre : arrive des profondeurs, se pose, tourne lentement, puis monte pour la citation
    const a = spring(t - D, 90, 19);
    const up = P(t, 44.2, 45.2, io);
    const ry = lerp(-75, -24, a) + 18 * P(t, D + 0.8, 52.5, io) + 1.5 * Math.sin(t * 0.9);
    const rx = lerp(18, 6, a) + 1.2 * Math.sin(t * 0.7);
    const sc = lerp(0.18, 1, a) * lerp(1, 0.62, up);
    const y = lerp(900, 560, up) + 10 * Math.sin(t * 1.1);
    S.bookPos.style.transform = `translate(0px, ${y - 900}px) scale(${sc})`;
    S.bookPos.style.opacity = P(t, D, D + 0.12);
    S.book.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    S.shadow.style.opacity = a * 0.9;
    const g1 = P(t, 38.1, 39.1, io), g2 = P(t, 40.7, 41.6, io), g3 = P(t, 47.6, 48.6, io);
    const g = (t < 40.5 ? g1 : t < 47.4 ? g2 : g3);
    S.glare.style.transform = `translateX(${lerp(-10, 75, g)}%)`;
    S.glare.style.opacity = (g > 0 && g < 1) ? 1 : 0;
    S.kente.style.clipPath = `inset(0 ${100 - 100 * P(t, D + 0.1, D + 0.8, o5)}% 0 0)`;
    S.kente.style.backgroundPosition = `${-t * 30}px 0`;
    S.endRule.style.transform = `scaleX(${P(t, 47.6, 48.1, o5)})`;
    S.s7tx.style.transform = `translateY(${-8 * P(t, 45, 52.5, x => x)}px)`;
    S.s7.style.opacity = 1;
  }
  S.flash.style.opacity = t < 6.0 || t > 7.2 ? 0 : P(t, 6.2, 6.55, inn) * (1 - P(t, 6.55, 7.15, out));
  document.getElementById('tc').textContent = t.toFixed(2);
};

// ---------- prévisualisation (n'intervient jamais dans le rendu) ----------
let playing = false, t0 = 0, cur = 0, wall = 0;
const aud = document.getElementById('aud');
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); document.getElementById('wrap').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
function loop(now) { if (!playing) return; cur = t0 + (now - wall) / 1000; if (cur >= DUR) { playing = false; cur = DUR; } window.seek(cur); requestAnimationFrame(loop); }
function play(from) { t0 = from; wall = performance.now(); playing = true; try { aud.currentTime = from; aud.play(); } catch (e) { } requestAnimationFrame(loop); }
addEventListener('keydown', e => {
  if (e.code === 'Space') { if (playing) { playing = false; aud.pause(); } else play(cur >= DUR ? 0 : cur); e.preventDefault(); }
  if (e.code === 'ArrowRight') { playing = false; aud.pause(); cur = Math.min(DUR, cur + 1 / FPS); window.seek(cur); }
  if (e.code === 'ArrowLeft') { playing = false; aud.pause(); cur = Math.max(0, cur - 1 / FPS); window.seek(cur); }
  if (e.code === 'KeyR') { cur = 0; play(0); }
});

Promise.all([document.fonts.ready, ...['cover_1280.jpg', 'pattern.png', 'kente.jpg', 'nsoromma_frame.png', 'heart.png', 'gye_nyame.png', 'sankofa.png', 'dwennimmen.png']
  .map(f => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'brand/img/' + f; }))])
  .then(() => Promise.all(['900 100px Fraunces', '800 100px Fraunces', '600 100px Fraunces', 'italic 600 100px Fraunces', '400 20px Poppins', '500 20px Poppins', '600 20px Poppins'].map(f => document.fonts.load(f, 'AÉé’«»'))))
  .then(() => { window.seek(0); window.ready = true; });
