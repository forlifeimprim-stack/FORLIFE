<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UVCI — Motion Design</title>
<style>
/*__FONTS__*/
:root{--bg:#07020B;--fg:#fff;--muted:rgba(255,255,255,.6);--o:#7C2888;--g:#158C4E}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#07020B}}
:root[data-theme="light"]{--bg:#07020B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Poppins',system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:auto;max-height:100%;aspect-ratio:16/9;object-fit:contain;display:block;max-width:calc(100vh*16/9)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 50%,rgba(124,40,136,.35),rgba(7,2,11,.88) 60%);border:0;color:#fff;cursor:pointer;font:inherit}
#start .ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#9B3DB0,#158C4E);box-shadow:0 0 0 10px rgba(124,40,136,.25),0 0 60px rgba(142,242,90,.35);transition:transform .25s}
#start:hover .ring{transform:scale(1.07)}
#start .ring svg{width:40px;height:40px;margin-left:6px}
#start b{font-weight:600;letter-spacing:.3em;font-size:13px;text-transform:uppercase}
#start small{color:var(--muted);font-size:12px}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;display:flex;gap:12px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:opacity .3s}
#wrap:hover #bar,#bar:focus-within{opacity:1}
.render #bar{display:none}
#bar button{background:none;border:0;color:#fff;cursor:pointer;width:32px;height:32px;display:grid;place-items:center}
#bar input{flex:1;accent-color:#8EF25A}
#bar span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:80px;text-align:right}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080" aria-label="Motion design UVCI"></canvas>
  <button id="start" aria-label="Lancer la vidéo">
    <span class="ring"><svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg></span>
    <b>Lancer avec le son</b><small>Université Virtuelle de Côte d'Ivoire · 50 s</small>
  </button>
  <div id="bar">
    <button id="pp" aria-label="Lecture / pause"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path id="ppi" d="M6 4l14 8-14 8z"/></svg></button>
    <input id="seek" type="range" min="0" max="50.5" step="0.01" value="0" aria-label="Position">
    <span id="tm">0.0 / 50.5</span>
  </div>
</div>
<audio id="au" preload="auto" src="__AUDIO__"></audio>
<script>
(()=>{
const W=1920,H=1080,DUR=50.5;
const cv=document.getElementById('c'),x=cv.getContext('2d');
// Charte UVCI : violet du V, vert du sigle, vert lime « Akwaba »
const O='#9B3DB0',OL='#8EF25A',G='#158C4E',GL='#3FD47F',P='#7C2888',PD='#2B0E3A',NAVY='#222133',WH='#FFFFFF',INK='#07020B';
const PO="'Poppins',sans-serif",PF="'Playfair Display',serif";

/* ---------- utilitaires ---------- */
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  out:k=>1-Math.pow(1-k,3),
  out5:k=>1-Math.pow(1-k,5),
  io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  in:k=>k*k*k,
  expo:k=>k>=1?1:1-Math.pow(2,-10*k),
  back:k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)},
  el:k=>k===0||k===1?k:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1
};
// visibilité d'une fenêtre [a,b] avec fondus
const win=(t,a,b,fi=.4,fo=.4)=>Math.min(pr(t,a,a+fi),1-pr(t,b-fo,b));
function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let r=Math.imul(seed^seed>>>15,1|seed);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
function font(sz,w=600,f=PO,it=''){return `${it} ${w} ${sz}px ${f}`}
function txt(s,X,Y,o={}){
  x.save();
  x.font=font(o.size||40,o.weight||600,o.family||PO,o.italic?'italic':'');
  x.textAlign=o.align||'left';x.textBaseline=o.base||'alphabetic';
  if(o.ls!=null)x.letterSpacing=o.ls+'px';
  x.globalAlpha*=(o.alpha==null?1:o.alpha);
  if(o.blur>0.3)x.filter=`blur(${o.blur}px)`;
  if(o.glow){x.shadowColor=o.glow;x.shadowBlur=o.glowB||30}
  if(o.stroke){x.strokeStyle=o.stroke;x.lineWidth=o.lw||2;x.strokeText(s,X,Y)}
  else{x.fillStyle=o.color||WH;x.fillText(s,X,Y)}
  x.restore();
}
function measure(s,o){x.save();x.font=font(o.size||40,o.weight||600,o.family||PO,o.italic?'italic':'');if(o.ls!=null)x.letterSpacing=o.ls+'px';const w=x.measureText(s).width;x.restore();return w}
// mots révélés un par un (montée + flou)
function words(t,list,X,Y,o={}){
  const sp=measure(' ',o);
  const ws=list.map(w=>measure(w[0],o));
  let total=ws.reduce((a,b)=>a+b,0)+sp*(list.length-1);
  let cx=o.align==='center'?X-total/2:o.align==='right'?X-total:X;
  list.forEach((w,i)=>{
    const kk=pr(t,w[1],w[1]+(o.dur||.38)),k=E.out(kk),kb=E.back(kk);
    if(k>0){
      txt(w[0],cx,Y+(1-kb)*(o.size||40)*.7,{...o,align:'left',alpha:(o.alpha==null?1:o.alpha)*k,blur:(1-k)*12,color:w[2]||o.color});
    }
    cx+=ws[i]+sp;
  });
  return total;
}
function rrect(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function grad(x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach(([p,c])=>g.addColorStop(p,c));return g}

/* ---------- sprites lumineux ---------- */
function glowSprite(col,sz=64){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');const r=g.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.18,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,sz,sz);return c}
const SP={o:glowSprite('rgba(185,90,225,.9)'),g:glowSprite('rgba(130,240,90,.85)'),w:glowSprite('rgba(255,255,255,.7)')};
function dot(s,X,Y,r,a=1){if(a<=0)return;x.globalAlpha=a;x.drawImage(s,X-r,Y-r,r*2,r*2);x.globalAlpha=1}

/* ---------- logo officiel ---------- */
const LOGO={};[['full','__LOGO_FULL__'],['mark','__LOGO_MARK__'],['text','__LOGO_TEXT__']].forEach(([k,src])=>{const im=new Image();im.src=src;LOGO[k]=im});
const LOGO_OK=Promise.all(Object.values(LOGO).map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve()));
// dessine un logo (hauteur h) ; cx,cy = centre
function logo(k,cx,cy,h,a=1){const im=LOGO[k];if(!im.naturalWidth||a<=0)return;const w=h*im.naturalWidth/im.naturalHeight;x.save();x.globalAlpha*=a;x.drawImage(im,cx-w/2,cy-h/2,w,h);x.restore();return w}
// pastille blanche + sigle (pour les fonds sombres)
function logoPill(cx,cy,h,a=1){const im=LOGO.mark;const w=h*.9*im.naturalWidth/im.naturalHeight+h*.9;x.save();x.globalAlpha*=a;rrect(cx-w/2,cy-h/2,w,h,h/2);x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=24;x.fill();x.shadowBlur=0;x.restore();logo('mark',cx,cy,h*.72,a);return w}

/* ---------- grain ---------- */
const GR=[];for(let i=0;i<4;i++){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);const R=rnd(99+i);for(let j=0;j<d.data.length;j+=4){const v=R()*255;d.data[j]=d.data[j+1]=d.data[j+2]=v;d.data[j+3]=255}g.putImageData(d,0,0);GR.push(x.createPattern(c,'repeat'))}

/* ---------- fond ---------- */
const DUST=[];{const R=rnd(3);for(let i=0;i<140;i++)DUST.push({x:R()*W,y:R()*H,s:R()*1.6+.4,v:R()*8+2,p:R()*6.28,c:R()<.5?'o':(R()<.5?'g':'w')})}
function background(t){
  x.globalCompositeOperation='source-over';
  const bg=x.createRadialGradient(W/2,H*.55,0,W/2,H/2,W*.75);
  bg.addColorStop(0,'#2A0D3A');bg.addColorStop(.55,'#150620');bg.addColorStop(1,'#05010A');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  // aurores
  x.globalCompositeOperation='screen';
  const blobs=[[O,.28,.22,.3,.0],[G,.22,.78,.62,1.7],[O,.16,.65,.15,3.1],[G,.14,.2,.85,4.4]];
  blobs.forEach(([c,a,bx,by,ph])=>{
    const X=W*(bx+.06*Math.sin(t*.21+ph)),Y=H*(by+.07*Math.cos(t*.17+ph)),r=W*.42;
    const g=x.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,hexA(c,a));g.addColorStop(1,hexA(c,0));
    x.fillStyle=g;x.fillRect(0,0,W,H);
  });
  x.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const Y=(d.y-t*d.v)%H;const yy=Y<0?Y+H:Y;dot(SP[d.c],d.x+Math.sin(t*.5+d.p)*10,yy,d.s*5,.35)});
  x.globalCompositeOperation='source-over';
}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function post(t,frame){
  // vignette (allégée sur les fonds blancs)
  const wh=Math.max(win(t,9.0,12.0,.3,.05),pr(t,46.2,46.9));
  const v=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(10,0,20,${.72-.6*wh})`);
  x.fillStyle=v;x.fillRect(0,0,W,H);
  // grain
  x.save();x.globalAlpha=.055;x.globalCompositeOperation='overlay';x.fillStyle=GR[frame%4];
  x.translate((frame*37)%256,(frame*91)%256);x.fillRect(-256,-256,W+512,H+512);x.restore();
  // fondu entrée/sortie
  const a=Math.max(1-pr(t,0,.8),pr(t,DUR-1.4,DUR));
  if(a>0){x.fillStyle=`rgba(7,2,11,${a})`;x.fillRect(0,0,W,H)}
}
// volet tricolore diagonal
function wipe(t,t0,dir=1){
  const k=pr(t,t0-.45,t0+.45);if(k<=0||k>=1)return;
  const cols=[P,'#FFFFFF',G,PD];
  x.save();
  cols.forEach((c,i)=>{
    const kk=E.io(cl(k*1.25-i*.08));
    const span=W+900;const pos=-450+kk*span*1.0;
    const w=lerp(0,700,Math.sin(Math.PI*kk));
    x.fillStyle=c;x.globalAlpha=i===1?.9:1;
    x.beginPath();
    const X0=dir>0?pos-w/2:W-pos-w/2;
    x.moveTo(X0+200,0);x.lineTo(X0+200+w,0);x.lineTo(X0-200+w,H);x.lineTo(X0-200,H);x.closePath();x.fill();
  });
  x.restore();
}

/* ---------- SCÈNE 1 & 2 : la salle sans murs -> le téléphone ---------- */
const ROOM=[];// segments 3D
(function(){
  const X=620,Y=360,Z0=0,Z1=1500;
  const box=(x0,y0,z0,x1,y1,z1)=>{const p=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(([a,b])=>ROOM.push([p[a],p[b],1]))};
  // murs
  [[-X,-Y,Z1],[X,-Y,Z1],[X,Y,Z1],[-X,Y,Z1]].forEach((p,i,a)=>ROOM.push([p,a[(i+1)%4],0]));
  [[-X,-Y],[X,-Y],[X,Y],[-X,Y]].forEach(([a,b])=>ROOM.push([[a,b,Z0],[a,b,Z1],0]));
  for(let z=300;z<Z1;z+=300){ROOM.push([[-X,Y,z],[X,Y,z],2]);ROOM.push([[-X,-Y,z],[X,-Y,z],2])}
  // tableau
  const bw=460,bh=150,by=-235;
  [[-bw/2,by-bh/2],[bw/2,by-bh/2],[bw/2,by+bh/2],[-bw/2,by+bh/2]].forEach((p,i,a)=>ROOM.push([[p[0],p[1],Z1-2],[a[(i+1)%4][0],a[(i+1)%4][1],Z1-2],3]));
  // fenêtres
  for(let z=300;z<=1100;z+=400){[[-X,1],[X,1]].forEach(([wx])=>{const q=[[wx,-200,z],[wx,-200,z+220],[wx,20,z+220],[wx,20,z]];q.forEach((p,i)=>ROOM.push([p,q[(i+1)%4],1]))})}
  // tables
  for(let r=0;r<3;r++)for(let c=-1;c<=1;c++){const cx=c*330,cz=450+r*300;box(cx-95,Y-120,cz-45,cx+95,Y-105,cz+45)}
})();
const PTS=[];
(function(){
  const R=rnd(11);
  ROOM.forEach(([a,b,kind])=>{
    const len=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);const n=Math.max(2,Math.round(len/(kind===1?22:34)));
    for(let i=0;i<n;i++){const k=i/n;const p=[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
      const d=Math.hypot(p[0],p[1])+1;
      PTS.push({p,v:[p[0]/d*(500+R()*900)+(R()-.5)*500,p[1]/d*(500+R()*900)+(R()-.5)*500,-(R()*1300+200)],c:R()<.45?'o':R()<.55?'g':'w',s:R()*1.4+.8,del:R()*.9,tg:null})}
  });
  // cibles : contour + écran du téléphone
  const PX=1290,PY=540,PW=380,PH=760;
  PTS.forEach((q,i)=>{
    const u=i/PTS.length;
    if(u<.55){// périmètre
      const per=2*(PW+PH);let s=u/.55*per;let X,Y;
      if(s<PW){X=PX-PW/2+s;Y=PY-PH/2}else if((s-=PW)<PH){X=PX+PW/2;Y=PY-PH/2+s}else if((s-=PH)<PW){X=PX+PW/2-s;Y=PY+PH/2}else{s-=PW;X=PX-PW/2;Y=PY+PH/2-s}
      q.tg=[X,Y];
    }else{q.tg=[PX-PW/2+30+R()*(PW-60),PY-PH/2+60+R()*(PH-120)]}
  });
})();
function cam(t){return{z:lerp(-760,-430,E.io(pr(t,0,5.2))),ry:lerp(-.06,.08,E.io(pr(t,0,5.5)))}}
function proj(p,c){
  const cs=Math.cos(c.ry),sn=Math.sin(c.ry);
  const zc=750;const X=(p[0])*cs-(p[2]-zc)*sn,Z=(p[0])*sn+(p[2]-zc)*cs+zc;
  const z=Z-c.z;if(z<40)return null;const f=980/z;
  return[W/2+X*f,H/2+p[1]*f,f];
}
const TB=3.62;// éclatement sur « murs »
function burstPos(q,t){const dt=Math.max(0,t-TB),k=(1-Math.exp(-dt*1.9))/1.9;return[q.p[0]+q.v[0]*k,q.p[1]+q.v[1]*k+dt*dt*20,q.p[2]+q.v[2]*k]}

function scene12(t){
  if(t>9.4)return;
  const c=cam(t);
  // lignes avant éclatement
  const la=win(t,.6,TB+.05,1.2,.05);
  if(la>0){
    x.save();x.lineCap='round';
    const jit=pr(t,TB-.35,TB)*6;
    ROOM.forEach(([a,b,kind],i)=>{
      const A=proj(a,c),B=proj(b,c);if(!A||!B)return;
      const R=Math.sin(i*12.9898+t*40)*jit;
      x.strokeStyle=kind===3?hexA(O,.9):kind===1?'rgba(255,255,255,.55)':'rgba(255,255,255,.8)';
      x.lineWidth=Math.max(.8,1.6*(A[2]+B[2]));
      // tracé progressif
      const k=E.out(pr(t,.5+i*.006,1.6+i*.006));
      x.globalAlpha=la*(kind===2?.35:.9)*Math.min(1,(A[2]+B[2])*1.4);
      x.beginPath();x.moveTo(A[0]+R,A[1]);x.lineTo(lerp(A[0],B[0],k)+R,lerp(A[1],B[1],k));x.stroke();
    });
    x.restore();
    // craie au tableau
    const ka=la*pr(t,1.4,2.2);
    if(ka>0){const P=proj([0,-235,1498],c);if(P){txt('Bienvenue',P[0],P[1]+12*P[2],{size:50*P[2],family:PF,italic:1,weight:500,color:'rgba(255,255,255,.85)',align:'center',alpha:ka})}}
  }
  // particules
  if(t>=TB){
    x.globalCompositeOperation='lighter';
    const fadeOut=1-pr(t,7.3,8.2);
    PTS.forEach(q=>{
      const b=burstPos(q,t);let P=proj(b,c);
      const k=E.io(pr(t,4.6+q.del,6.3+q.del));
      let X,Y,r;
      if(P){X=P[0];Y=P[1];r=q.s*3.5*Math.min(2.2,P[2]*1.4)}else{X=W/2;Y=H/2;r=0}
      if(k>0){X=lerp(X,q.tg[0],k);Y=lerp(Y,q.tg[1],k);r=lerp(r,q.s*3,k)}
      if(!P&&k===0)return;
      const fl=t<TB+.25?1+3*(1-pr(t,TB,TB+.25)):1;
      dot(SP[q.c],X,Y,r*fl,fadeOut*(.9));
    });
    x.globalCompositeOperation='source-over';
  }
  // flash d'éclatement
  const fk=pr(t,TB,TB+.7);
  if(fk>0&&fk<1){x.save();x.globalCompositeOperation='lighter';
    const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.6*E.out(fk)+1);g.addColorStop(0,`rgba(255,200,140,${.5*(1-fk)})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.strokeStyle=`rgba(255,255,255,${.6*(1-fk)})`;x.lineWidth=3;x.beginPath();x.arc(W/2,H/2,W*.5*E.out(fk),0,7);x.stroke();x.restore()}
  // Texte scène 1
  const a1=win(t,.9,4.6,.3,.5);
  if(a1>0){
    x.save();const pg=x.createRadialGradient(W/2,H/2+40,0,W/2,H/2+40,620);pg.addColorStop(0,`rgba(2,8,5,${.75*a1})`);pg.addColorStop(1,'rgba(2,8,5,0)');x.fillStyle=pg;x.fillRect(0,0,W,H);x.restore();
    words(t,[['Imagine',1.0],['une',1.62],['université…',1.8]],W/2,H/2+20,{size:76,weight:300,align:'center',alpha:a1,ls:1});
    words(t,[['sans',3.36],['murs.',3.56,O]],W/2,H/2+140,{size:110,family:PF,italic:1,weight:500,align:'center',alpha:a1});
  }
  // Texte scène 2
  const a2=win(t,4.4,9.0,.3,.3);
  if(a2>0){
    const L=150;
    words(t,[['Une',4.5],['université',4.66]],L,370,{size:64,weight:300,alpha:a2});
    words(t,[['qui',5.48],['ne',5.68],['t’attend',5.8],['plus',6.28]],L,455,{size:64,weight:300,alpha:a2});
    words(t,[['quelque',6.44],['part…',6.84]],L,540,{size:64,weight:600,alpha:a2*(1-.55*pr(t,7.5,7.9))});
    words(t,[['…mais',7.68],['qui',7.86],['vient',8.0],['à',8.42],['toi.',8.6]],L,680,{size:92,family:PF,italic:1,weight:500,alpha:a2,color:OL});
    const lk=E.out(pr(t,4.5,5.3));x.fillStyle=O;x.globalAlpha=a2;x.fillRect(L,270,120*lk,5);x.fillStyle=G;x.fillRect(L+130*lk,270,40*lk,5);x.globalAlpha=1;
  }
  // téléphone
  const pa=pr(t,6.3,7.2);
  if(pa>0)phone(t,pa);
}
function phone(t,a){
  const z=E.in(pr(t,8.55,9.2));
  const PX=1290,PY=540,PW=380,PH=760;
  x.save();
  const s=1+z*9;
  x.translate(lerp(PX,W/2,z),lerp(PY,H/2,z));x.scale(s,s);
  x.rotate(lerp(-.05,0,E.out(pr(t,6.3,8.2)))*(1-z));

// temps forts (calés sur la voix) : [instant, intensité]
const HITS=[[3.62,1],[9.12,1.4],[12.12,.8],[13.08,.6],[13.64,.5],[14.44,.4],[15.64,.5],[16.6,.7],[18.28,.55],[19.96,.55],[21.0,.55],[22.04,.55],[23.64,.55],[25.8,1.2],[26.48,.5],[27.4,.5],[28.76,.6],[29.32,.7],[31.24,.4],[32.28,.6],[33.04,.6],[33.96,.6],[35.4,.5],[36.44,.4],[38.12,.7],[39.4,.5],[40.12,.8],[41.32,.3],[43.16,.5],[43.95,1.2],[46.3,.9]];
function camera(t){
  let z=0,sh=0;
  for(const[h,w] of HITS){if(t>=h){const d=t-h;z+=w*.04*Math.exp(-d*6)*Math.min(1,d*30);if(w>=1)sh+=w*Math.exp(-d*8)}}
  return{s:1.03+z+.012*Math.sin(t*.45),r:.005*Math.sin(t*.31),sx:sh*13*Math.sin(t*83),sy:sh*11*Math.cos(t*71)};
}
function streaks(t){
  x.save();x.globalCompositeOperation='lighter';
  HITS.forEach(([h,w],hi)=>{const d=t-h;if(w<.55||d<0||d>.55)return;const R=rnd(400+hi);const dir=hi%2?1:-1;
    for(let i=0;i<14;i++){const y=R()*H,len=250+R()*650,th=1.5+R()*4,sp=4000+R()*5000,off=R()*W;
      const X=dir>0?-len+((off+d*sp)%(W+len*2)):W+len-((off+d*sp)%(W+len*2));
      x.globalAlpha=(1-d/.55)*.55*w;x.fillStyle=grad(X,0,X+len,0,[[0,'rgba(255,255,255,0)'],[.5,[OL,'#ffffff','#C77BE0'][i%3]],[1,'rgba(255,255,255,0)']]);x.fillRect(X,y,len,th)}});
  x.restore();
  HITS.forEach(([h,w])=>{const d=t-h;if(w<1||d<0||d>.4)return;x.fillStyle=`rgba(255,255,255,${.35*Math.exp(-d*12)})`;x.fillRect(0,0,W,H)});
}
function render(t,frame){
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.filter='none';
  const c=camera(t);
  x.save();x.translate(W/2+c.sx,H/2+c.sy);x.rotate(c.r);x.scale(c.s,c.s);x.translate(-W/2,-H/2);
  background(t);
  scene12(t);scene3(t);scene4(t);scene5(t);scene6(t);scene7(t);scene8(t);
  x.restore();
  streaks(t);
  wipe(t,12.0,1);wipe(t,16.45,-1);wipe(t,28.3,1);wipe(t,40.05,-1);
  post(t,frame);

/* ---------- lecteur ---------- */
const au=document.getElementById('au'),st=document.getElementById('start'),pp=document.getElementById('pp'),ppi=document.getElementById('ppi'),sk=document.getElementById('seek'),tm=document.getElementById('tm');
let playing=false,t0=0,tStart=0,cur=0;

function loop(){if(st.isConnected){render(11.6,0);requestAnimationFrame(loop);return}cur=Math.min(DUR,now());render(cur,Math.round(cur*30));sk.value=cur;tm.textContent=cur.toFixed(1)+' / '+DUR;if(cur>=DUR&&playing)pause();requestAnimationFrame(loop)}

})();
