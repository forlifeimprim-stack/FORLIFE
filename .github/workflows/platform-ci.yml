name: Platform CI (Forlife Com OS)

on:
  push:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forlife
          POSTGRES_PASSWORD: forlife
          POSTGRES_DB: forlife_com_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forlife -d forlife_com_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forlife:forlife@localhost:5432/forlife_com_test
      DATABASE_URL: postgresql://forlife:forlife@localhost:5432/forlife_com_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: FFmpeg (rendu vidéo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @forlife/web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image de production de l'API
        run: docker build -t forlife-api:ci platform
