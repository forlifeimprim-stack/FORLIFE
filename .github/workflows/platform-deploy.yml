name: Déploiement plateforme (Cloud Run + Firebase Hosting)

# Déclenchement manuel uniquement : Actions → « Déploiement plateforme » → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'forlifecom-6eef9' }}
  REGION: europe-west1
  SERVICE: forlife-api
  REPOSITORY: forlife

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Image de l'API (Artifact Registry)
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" platform
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Déploiement Cloud Run
        env:
          APP_URL: ${{ vars.APP_URL }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS || 'anthropic,mock' }}
          PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
          EMAIL_DRIVER: ${{ vars.EMAIL_DRIVER || 'log' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'Forlife Com <no-reply@forlifecom.ci>' }}
          PAYMENT_SANDBOX_ENABLED: ${{ vars.PAYMENT_SANDBOX_ENABLED || 'false' }}
          SOCIAL_SANDBOX_ENABLED: ${{ vars.SOCIAL_SANDBOX_ENABLED || 'true' }}
          # Secrets optionnels (ex. « ANTHROPIC_API_KEY=forlife-anthropic-key:latest,CINETPAY_API_KEY=forlife-cinetpay-key:latest »)
          EXTRA_SECRETS: ${{ vars.EXTRA_SECRETS }}
          # Variables supplémentaires séparées par « | » (ex. « CINETPAY_SITE_ID=123|META_APP_ID=456 »)
          EXTRA_ENV: ${{ vars.EXTRA_ENV }}
        run: |
          SECRETS="DATABASE_URL=forlife-database-url:latest,JWT_SECRET=forlife-jwt-secret:latest,ENCRYPTION_KEY=forlife-encryption-key:latest"
          [ -n "$EXTRA_SECRETS" ] && SECRETS="$SECRETS,$EXTRA_SECRETS"
          ENVV="^|^NODE_ENV=production|STORAGE_DRIVER=gcs|GCS_BUCKET=$GCS_BUCKET|APP_URL=$APP_URL|API_PUBLIC_URL=$APP_URL|WEB_ORIGIN=$APP_URL|AI_PROVIDERS=$AI_PROVIDERS|PLATFORM_ADMIN_EMAILS=$PLATFORM_ADMIN_EMAILS|EMAIL_DRIVER=$EMAIL_DRIVER|EMAIL_FROM=$EMAIL_FROM|PAYMENT_SANDBOX_ENABLED=$PAYMENT_SANDBOX_ENABLED|SOCIAL_SANDBOX_ENABLED=$SOCIAL_SANDBOX_ENABLED|RUN_WORKER_INLINE=true"
          [ -n "$EXTRA_ENV" ] && ENVV="$ENVV|$EXTRA_ENV"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" --platform managed \
            --service-account "forlife-api@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --cpu 2 --memory 2Gi --timeout 300 --concurrency 40 \
            --min-instances 1 --max-instances 4 --no-cpu-throttling \
            ${CLOUDSQL_INSTANCE:+--add-cloudsql-instances "$CLOUDSQL_INSTANCE"} \
            --set-env-vars "$ENVV" \
            --set-secrets "$SECRETS"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Build de l'interface
        working-directory: platform
        run: npm ci && npm run build:shared && npm run build -w @forlife/web

      - name: Firebase Hosting (cible « app »)
        working-directory: platform
        run: npx --yes firebase-tools@13 deploy --only hosting:app --project "$PROJECT_ID" --non-interactive
